display_name: Patchbay
short_description: Run gated multi-agent plan/write/test/review workflows.
default_prompt: Use Patchbay's conversational agent for this task when available. Start with patchbay_agent or scripts/patchbay agent message --background --json, show the generated plan, preserve the plan/apply gates, poll context/events, inspect economy routing evidence for write/fix work, run bounded fix loops only after review requests changes, and ask before final apply.
