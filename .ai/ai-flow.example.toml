[models]
planner = "claude-opus-4-7"
writer = "deepseek-v4-pro"
reviewer = "gpt-5.5"

[commands]
claude = "claude"
codex = "codex"
reasonix = "" # reasonix_cli 时填 reasonix/reasonix.cmd；ai-flow 会调用 reasonix acp

[writer]
provider = "deepseek_api" # 可选：reasonix_cli / deepseek_api
max_context_files = 30
max_patch_attempts = 3
max_repair_iterations = 2

[deepseek]
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"

[workflow]
require_plan_approval = true
default_branch_prefix = "ai-flow"
worktree_root = "../.ai-flow-worktrees"
fail_on_dirty_workspace = true
apply_to_current_workspace_only_after_review_pass = true

[commands_allowlist]
test = [
  "npm test",
  "npm run test",
  "npm run lint",
  "npm run typecheck",
  "pytest",
  "pytest -q",
  "go test ./...",
  "cargo test"
]
